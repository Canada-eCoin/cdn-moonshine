# Dependabot version updates.
#
# Why this exists: this repo sat five React Native majors behind without anyone
# noticing — the JavaScript moved to 0.78 while the Podfile still called `use_flipper!`
# and ios/Podfile.lock pinned React 0.63.3, so `pod install` could not even parse. A
# weekly, grouped update PR is the cheapest way to stop that recurring silently.
#
# Dependabot opens PRs against master. Both build workflows are workflow_dispatch-only,
# so an update PR starts nothing automatically — it sits until someone dispatches.
#
# NOTE ON COCOAPODS: Dependabot does not support the CocoaPods ecosystem (verified
# against the supported-ecosystem list: cocoapods is absent). The iOS pods in
# ios/Podfile.lock therefore cannot be tracked here. Two consequences:
#   * pods move only when a podspec is re-resolved, which happens when their npm
#     parents move — so the `npm` entry below is what indirectly moves them;
#   * the three Swift pods that block Xcode 26 (react-native-vision-camera,
#     lottie-react-native, lottie-ios) need a human to watch for compatible releases.
#     Renovate supports CocoaPods if that ever becomes worth adding.
#
# Version RANGES in package.json bound what can be proposed: `react-native: ^0.78.0`
# permits 0.78.x only, so no React Native minor/major jump will arrive as a PR. Those
# stay deliberate, which is the intent.
#
# RESOLUTIONS. Where a parent pins a package below its fixed version, no range is
# available for Dependabot to move and no security PR can be opened. One entry remains,
# with its reason here because package.json cannot carry comments:
#
#   node-fetch  2.6.7   reached only through react-native-snap-carousel -> fbjs ->
#                       isomorphic-fetch, whose own range is ^1.0.1. Upstream fix is
#                       2.6.7; 3.x is ESM-only and would break the CJS caller.
#
# This map is now short on purpose. After the React Native 0.88 upgrade the parents that
# used to pin things (react-native-crypto/pbkdf2, styled-components/postcss,
# patch-package/tmp) moved to ranges that already include the fixes, so those pins were
# removed rather than left as folklore — the lockfile resolves them because the parents
# allow it, which is the state to prefer.
#
# What is left is not fixable by us at all: `deepmerge` 4.3.1 and `elliptic` 6.6.1 have
# no patched release published. Everything else — sharp, image-size, uuid 7,
# fast-xml-parser 4, and the rest of that list — was cleared by moving React Native to
# 0.88.1 and the libraries that ride it (bootsplash 7, metro 0.87, RN CLI 20,
# image-size 2, sharp 0.35).
#
# Recorded 2026-10-30: 101 open advisories -> 2 low, both with no fix upstream. That is
# the floor; new advisories will still arrive and should still be triaged.
# Recorded 2026-10-30: 101 open advisories -> 10 (the babel 6 tree removed here took
# the last critical). The number moves on its own — Dependabot re-scanned when the
# first five PRs landed and added eight more — so recount before quoting this figure.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '13:00'
      timezone: America/Toronto
    # Ten, not five. On 2026-10-30 this repo had 100 open advisories and exactly five
    # pull requests: the limit was the ceiling on how much could be fixed at once, and
    # every merge of a security PR had to wait for a slot. Raise it before the next
    # backlog, not after.
    open-pull-requests-limit: 10
    groups:
      # One PR for a pile of small bumps instead of twenty PRs.
      #
      # Groups apply to VERSION updates only. Security updates are always opened
      # individually — one PR per advisory — which is why a security backlog looks
      # like a pile of singletons rather than one grouped PR.
      npm-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
      time: '13:00'
      timezone: America/Toronto
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'

  # Keeps the actions in .github/workflows current, which matters more than usual here:
  # the pinned majors are the only thing standing between this repo and another
  # retired-runtime surprise like the actions/*@v3 pins that came with it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '13:00'
      timezone: America/Toronto
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(ci)'
