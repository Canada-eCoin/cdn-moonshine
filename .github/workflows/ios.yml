# iOS CI — manually driven, on purpose, like the Android workflow.
#
#     gh workflow run "iOS build (manual)" --ref master
#
# WHY THERE IS NO LINT/TEST JOB HERE: lint and jest are platform-agnostic and already
# run in the Android workflow's `verify` job. Running them again on a macOS runner
# would cost 10x the minutes for no additional signal. If you want the gate, dispatch
# the Android workflow; this workflow's job is to prove the *iOS app* builds.
#
# THIS WORKFLOW HOLDS NO KEYS, and unlike Android that is a hard constraint rather than
# a preference: an iOS app cannot be installed on a device without a signature Apple
# ties to a developer account. There is no `apksigner` equivalent. So this produces:
#
#   1. a simulator .app   — unsigned, runnable in Simulator, needs no account
#   2. an unsigned .xcarchive — the real device build, for whoever holds a certificate
#      and provisioning profile to sign and export themselves
#
# See docs/SIGNING-iOS.md.
#
# Cost note: macOS runners bill at 10x for private repos, but this repo is public, so
# these runs are free.
#
# Toolchain: the `xcode_version` input defaults to 16.4 (the Xcode 16.x line React Native
# 0.78 targets). 26.3 exists as a second option because Xcode's compilation cache — a
# content-addressed cache that, unlike the DerivedData cache, is still valid for unchanged
# sources — only exists in Xcode 26 and later. Whether these 230 pods compile under
# Xcode 26 at all has to be established before it could become the default.

name: iOS build (manual)

on:
  workflow_dispatch:
    inputs:
      artifacts:
        description: Which artifacts to produce
        type: choice
        options:
          - both
          - simulator-only
          - device-unsigned-only
        default: both
      xcode_version:
        description: Xcode toolchain (26.x is required for the compilation cache)
        type: choice
        options:
          - '16.4'
          - '26.3'
        default: '16.4'

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # Release embeds the JS bundle, so the resulting .app runs without a Metro packager.
  # A Debug simulator build would need `react-native start` beside it to be useful.
  XCODE_CONFIGURATION: 'Release'
  SCHEME: 'moonshine'
  # Xcode's compilation cache (LLVM CAS) is a CONTENT-ADDRESSED cache: it keys on input
  # hashes, not timestamps, which is what the DerivedData cache cannot do — a fresh
  # checkout makes every source file newer than the cached objects, so Xcode rebuilds all
  # ~2800 of them regardless. Two caveats: the feature landed in Xcode 26, and React
  # Native 0.78 targets the Xcode 16.x line. So the toolchain is an explicit input,
  # defaulting to the known-good 16.4; 26.3 is the opt-in experiment, and it needs to be
  # shown that these pods compile under it at all before it becomes the default.
  COMPILATION_CACHE_DIR: 'compilation-cache'

jobs:
  build:
    name: Build iOS
    # macos-15 (arm64) carries Xcode 16.4. macos-latest is macOS 26 now, newer than this
    # React Native release expects.
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode and report toolchain
        run: |
          set -euo pipefail
          sudo xcode-select -s "/Applications/Xcode_${{ inputs.xcode_version }}.app"
          {
            echo "### Toolchain"
            echo
            echo '```'
            xcodebuild -version
            echo "cocoapods: $(pod --version)"
            echo "ruby: $(ruby --version)"
            echo "node: $(node --version)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Caches are scoped so that a run can only restore caches written on its own
      # branch or on the default branch, and an entry is immutable once written for a
      # given key. So nothing a feature branch writes can ever be consumed by master —
      # poisoning a cache master reads requires the ability to write to master, which
      # already means pushing code. Nothing sensitive may be cached (caches are readable
      # by anyone with repo read access); these two hold dependencies and compile
      # output, no key material.
      #
      # Keys are deliberately STABLE (no run id) rather than refreshed per run: a
      # DerivedData cache is measured in gigabytes, and a per-run key would add another
      # multi-GB entry every run until LRU eviction started evicting the Gradle caches.
      # One entry per Podfile.lock is the right granularity — pods are what take the
      # time, and they only change when the lock does. Xcode recompiles whatever moved.
      - name: Restore CocoaPods download cache
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/CocoaPods
          key: cocoapods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            cocoapods-${{ runner.os }}-

      - name: Restore DerivedData cache
        uses: actions/cache@v6
        with:
          # Intermediates only: that is where the ~45 minutes of compiling 230 pods
          # ends up. Build/Products (linked .app bundles and dSYMs) is regenerated
          # cheaply and is what would blow the repo's 10 GB cache budget.
          path: ~/dd/Build/Intermediates.noindex
          key: ios-intermediates-${{ runner.os }}-xcode${{ inputs.xcode_version }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ios-intermediates-${{ runner.os }}-xcode${{ inputs.xcode_version }}-

      # Xcode's compilation cache. Content-addressed, so — unlike the DerivedData cache
      # above — a restored entry is still *correct* for unchanged sources. On Xcode 16.4
      # the settings are simply unrecognised and nothing is written; the size report in
      # the packaging step makes that visible rather than silently pretending to cache.
      - name: Restore compilation cache
        uses: actions/cache@v6
        with:
          # Xcode's own CAS default lives under DerivedData, but the diagnostics proved
          # the explicit COMPILATION_CACHE_CAS_PATH is honoured (it resolved to
          # /Users/runner/compilation-cache), so one path is enough.
          path: ~/compilation-cache
          key: xcode-compilation-cache-${{ runner.os }}-xcode${{ inputs.xcode_version }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            xcode-compilation-cache-${{ runner.os }}-xcode${{ inputs.xcode_version }}-

      # ios/Podfile.lock is committed, so this install is pinned. It is NOT run with
      # --deployment yet, which means CocoaPods will quietly update the lock if a podspec
      # moves underneath it. Making that a hard gate — the equivalent of
      # `yarn install --frozen-lockfile` — needs its own validation run; noted in the
      # brief rather than assumed here.
      - name: Install CocoaPods
        working-directory: ios
        env:
          COCOAPODS_DISABLE_STATS: 'true'
        run: pod install

      - name: Build simulator app
        if: inputs.artifacts != 'device-unsigned-only'
        run: |
          set -euo pipefail
          # $HOME must be expanded by the SHELL. An `env: DD: $HOME/dd` block does not
          # expand it — GitHub passes the literal string through — which produced
          # `<cwd>/$HOME/dd` and a ModuleCache path mismatch. A stable path is required
          # because this directory is what the DerivedData cache stores.
          DD="$HOME/dd"
          CAS="$HOME/$COMPILATION_CACHE_DIR"
          mkdir -p "$CAS"
          # Xcode 26 does not ship the Swift 5.6 compatibility shims, and the Swift pods in
          # this project (VisionCamera, lottie-ios, lottie-react-native) fail to link
          # against it — for BOTH architectures, not just the Intel slice as the first
          # failure suggested:
          #   Undefined symbols for architecture arm64:
          #     "__swift_FORCE_LOAD_$_swiftCompatibility56", referenced from liblottie-ios.a
          #
          # That force-load is emitted when the deployment target predates the OS release
          # that shipped the Swift 5.6 runtime, which is iOS 15.4. This project targets
          # 15.1, so the shim is pulled in and cannot be found. On 26.x the deployment
          # target is therefore raised to 15.4 as a build setting. Scoped to 26.x on
          # purpose: raising it for everyone would drop iOS 15.1-15.3 support, which is
          # the operator's call rather than a side effect of a toolchain experiment.
          DEPLOY_SETTING=""
          case "${{ inputs.xcode_version }}" in
            26.*) DEPLOY_SETTING="IPHONEOS_DEPLOYMENT_TARGET=15.4" ;;
          esac
          # Diagnostics: if a build fails on C++ headers (the first iOS run failed on
          # '<memory> file not found'), these lines say why without needing a 40-minute
          # rebuild. Teed to stdout as well as the summary so they are readable from
          # the job log via `gh run view --log`.
          {
            echo "### App target build settings"
            echo
            echo '```'
            xcodebuild -workspace ios/moonshine.xcworkspace -scheme "$SCHEME" \
              -configuration "$XCODE_CONFIGURATION" -derivedDataPath "$DD" \
              COMPILATION_CACHE_ENABLE_CACHING=YES \
              COMPILATION_CACHE_CAS_PATH="$CAS" \
              -showBuildSettings 2>/dev/null \
              | grep -E "CLANG_CXX_LANGUAGE_STANDARD|CLANG_CXX_LIBRARY|CLANG_ENABLE_MODULES|SWIFT_ENABLE_EXPLICIT_MODULES|_EXPERIMENTAL_SWIFT_EXPLICIT|IPHONEOS_DEPLOYMENT_TARGET|ENABLE_USER_SCRIPT_SANDBOXING|COMPILATION_CACHE" \
              | sort -u
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

          xcodebuild \
            -workspace ios/moonshine.xcworkspace \
            -scheme "$SCHEME" \
            -configuration "$XCODE_CONFIGURATION" \
            -sdk iphonesimulator \
            -derivedDataPath "$DD" \
            $DEPLOY_SETTING \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            COMPILATION_CACHE_CAS_PATH="$CAS" \
            COMPILATION_CACHE_ENABLE_DIAGNOSTIC_REMARKS=YES \
            build

      - name: Build unsigned device archive
        if: inputs.artifacts != 'simulator-only'
        run: |
          set -euo pipefail
          # Same DerivedData as the simulator build, so the two share the cached
          # intermediates and the device compile is incremental. Same compilation cache
          # too: content-addressed, so the simulator's artifacts can serve the device
          # build for anything architecture-independent.
          DD="$HOME/dd"
          CAS="$HOME/$COMPILATION_CACHE_DIR"
          mkdir -p "$CAS"
          xcodebuild \
            -workspace ios/moonshine.xcworkspace \
            -scheme "$SCHEME" \
            -configuration "$XCODE_CONFIGURATION" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/moonshine.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" PROVISIONING_PROFILE_SPECIFIER="" DEVELOPMENT_TEAM="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            COMPILATION_CACHE_CAS_PATH="$CAS" \
            COMPILATION_CACHE_ENABLE_DIAGNOSTIC_REMARKS=YES \
            $DEPLOY_SETTING \
            archive

      - name: Package and checksum
        id: stamp
        run: |
          set -euo pipefail
          BUILD_DATE="$(date -u +'%Y-%m-%d-%H%M')"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          echo "BUILD_DATE=$BUILD_DATE" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"

          OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT"
          BASE="moonshine-${BUILD_DATE}-${SHORT_SHA}"
          DD="$HOME/dd"

          # Matched by glob, not by name: the product is built as `Moonshine.app` even
          # though the target is `moonshine`, and this step runs on a case-insensitive
          # volume, so a name mismatch used to pass by luck.
          APP="$(find "$DD/Build/Products/${XCODE_CONFIGURATION}-iphonesimulator" \
                   -maxdepth 1 -name '*.app' -print -quit 2>/dev/null || true)"
          if [ -n "$APP" ] && [ -d "$APP" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$APP" "$OUT/${BASE}-simulator.app.zip"
          fi

          if [ -d "$RUNNER_TEMP/moonshine.xcarchive" ]; then
            ditto -c -k --sequesterRsrc --keepParent \
              "$RUNNER_TEMP/moonshine.xcarchive" "$OUT/${BASE}-unsigned.xcarchive.zip"
          fi

          if ! ls "$OUT"/*.zip >/dev/null 2>&1; then
            echo "::error::Neither artifact was produced — see the xcodebuild output above."
            exit 1
          fi

          # Report what the caches actually weigh, so the repo's 10 GB budget is
          # observable rather than assumed.
          {
            echo "### Cache sizes on the runner"
            echo
            echo '```'
            du -sh "$HOME/dd/Build/Intermediates.noindex" 2>/dev/null || echo "no DerivedData"
            du -sh "$HOME/Library/Caches/CocoaPods" 2>/dev/null || echo "no CocoaPods cache"
            for d in "$HOME/$COMPILATION_CACHE_DIR" "$HOME/dd/CompilationCache.noindex"; do
              [ -e "$d" ] && du -sh "$d" || echo "absent: $d"
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

          cp ios/Podfile.lock "$OUT/Podfile.lock" 2>/dev/null || true
          ( cd "$OUT" && shasum -a 256 ./* > SHA256SUMS )

          {
            echo "### Build $BUILD_DATE ($SHORT_SHA)"
            echo
            echo "| artifact | signed |"
            echo "|---|---|"
            if [ -f "$OUT/${BASE}-simulator.app.zip" ]; then
              echo "| \`${BASE}-simulator.app.zip\` | n/a — simulator only, install with \`xcrun simctl install\` |"
            fi
            if [ -f "$OUT/${BASE}-unsigned.xcarchive.zip" ]; then
              echo "| \`${BASE}-unsigned.xcarchive.zip\` | **unsigned — sign and export it yourself** |"
            fi
            echo
            echo '```'
            cat "$OUT/SHA256SUMS"
            echo '```'
            echo
            echo "Commit: \`$(git rev-parse HEAD)\`"
            echo
            echo "Signing instructions: \`docs/SIGNING-iOS.md\`. This workflow holds no keys."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          ls -l "$OUT"

      - name: Attach artifacts
        uses: actions/upload-artifact@v7
        with:
          name: moonshine-ios-${{ env.BUILD_DATE }}-${{ env.SHORT_SHA }}
          path: ${{ steps.stamp.outputs.out }}/*
          if-no-files-found: error
          # Long enough that whoever intends to sign and publish still can.
          retention-days: 90
