# Android CI — manually driven, on purpose.
#
# There is no `push:` and no `pull_request:` trigger here. Nothing builds, and nothing
# is published, until a person asks for it. Runs are started from the Actions tab
# ("Run workflow") or with:
#
#     gh workflow run "Android build (manual)" --ref master
#
# History: the previous version of this file triggered on push/PR to master and had
# never produced a single run — the workflow landed 2025-06-19 and nothing has been
# pushed to this repo since. It also pinned actions/checkout, actions/cache and
# actions/setup-java at v3, which are built for a Node 16 runtime GitHub has retired.
#
# THIS WORKFLOW HOLDS NO KEYS. There is not one `secrets.*` reference in it. Builds are
# deliberately unsigned; whoever wants to publish an APK downloads it, signs it with a
# key they control, and uploads it themselves. See docs/SIGNING.md.

name: Android build (manual)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Which APK(s) to build and attach
        type: choice
        options:
          - both
          - debug-only
          - release-only
        default: both

# Nothing outside the repo is read; nothing is written back.
permissions:
  contents: read

# A second manual run supersedes the first rather than racing it.
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '17'

jobs:
  verify:
    name: Lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Cheap and first: a lint failure should cost seconds, not a Gradle build.
      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test --ci

  build:
    name: Build APK
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # For actions/attest-build-provenance. These let the job mint a short-lived OIDC
      # token and write an attestation — not a stored secret, and not a signing key.
      # Nothing here can read a secret or push a commit.
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      # Replaces hand-rolled actions/cache@v3 blocks: caches the wrapper distribution,
      # the Gradle caches and the configuration cache, keyed correctly.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build debug APK
        if: inputs.variant != 'release-only'
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build release APK (unsigned)
        if: inputs.variant != 'debug-only'
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Stamp and checksum artifacts
        id: stamp
        run: |
          set -euo pipefail
          BUILD_DATE="$(date -u +'%Y-%m-%d-%H%M')"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          echo "BUILD_DATE=$BUILD_DATE" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"

          OUT=android/app/build/outputs/apk
          TMP="$(mktemp -d)"
          FOUND=0

          for pair in "debug/app-debug.apk:debug" "release/app-release-unsigned.apk:release-unsigned"; do
            src="${pair%%:*}"; label="${pair##*:}"
            if [ -f "$OUT/$src" ]; then
              dest="cdn-moonshine-${BUILD_DATE}-${SHORT_SHA}-${label}.apk"
              cp "$OUT/$src" "$TMP/$dest"
              FOUND=$((FOUND + 1))
            fi
          done

          if [ "$FOUND" -eq 0 ]; then
            echo "::error::No APKs were produced — check the Gradle output above."
            exit 1
          fi

          ( cd "$TMP" && sha256sum ./*.apk | tee SHA256SUMS )

          # --- artifact invariants -------------------------------------------------
          # Checked against the artifacts rather than assumed, because these are exactly
          # what docs/SIGNING.md makes promises about:
          #   * the release APK must NOT be signed — otherwise an APK no store accepts,
          #     and which nobody can re-sign without stripping it first, ships silently;
          #   * the debug APK must be signed, or it cannot be installed anywhere.
          # Identity values (applicationId, versionCode, SDK levels) are REPORTED, not
          # asserted, so a deliberate version bump cannot fail the build — but drift is
          # visible here instead of only in a document that still says `com.moonshine`.
          CHECK="$(mktemp)"
          BT="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | sort -V | tail -1)"
          echo "build-tools: ${BT:-not found}" >> "$CHECK"
          # Fail loudly rather than letting a missing tool make the checks below pass or
          # fail for the wrong reason.
          if [ -z "$BT" ] || [ ! -x "$BT/apksigner" ]; then
            echo "::error::apksigner not found under $ANDROID_HOME/build-tools — cannot verify the artifacts."
            exit 1
          fi

          if [ -f "$TMP"/cdn-moonshine-*-release-unsigned.apk ]; then
            REL="$(ls "$TMP"/cdn-moonshine-*-release-unsigned.apk)"
            if "$BT/apksigner" verify --print-certs "$REL" >/dev/null 2>&1; then
              echo "::error::the release APK verifies as SIGNED. It must be unsigned so whoever publishes can sign it with their own key — check for a signingConfig on the release buildType in android/app/build.gradle."
              exit 1
            fi
            echo "release APK: unsigned (apksigner verify fails, as intended)" >> "$CHECK"
            "$BT/aapt2" dump badging "$REL" 2>/dev/null \
              | grep -E "^package:|^sdkVersion|^targetSdkVersion|^application-label:" \
              | sed 's/^/release APK: /' >> "$CHECK" || true
          fi

          if [ -f "$TMP"/cdn-moonshine-*-debug.apk ]; then
            DBG="$(ls "$TMP"/cdn-moonshine-*-debug.apk)"
            if ! "$BT/apksigner" verify "$DBG" >/dev/null 2>&1; then
              echo "::error::the debug APK does not verify as signed, so it cannot be installed. Check android/app/debug.keystore."
              exit 1
            fi
            echo "debug APK: signed with the committed debug keystore (expected)" >> "$CHECK"
            "$BT/aapt2" dump badging "$DBG" 2>/dev/null \
              | grep -E "^package:|^sdkVersion|^targetSdkVersion" \
              | sed 's/^/debug APK: /' >> "$CHECK" || true
          fi

          { echo; echo "### Artifact checks"; echo; echo '```'; cat "$CHECK"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

          {
            echo "### Build $BUILD_DATE ($SHORT_SHA)"
            echo
            echo "| artifact | source apk | signed |"
            echo "|---|---|---|"
            if [ -f "$TMP"/cdn-moonshine-*-debug.apk ]; then
              echo "| cdn-moonshine-${BUILD_DATE}-${SHORT_SHA}-debug.apk | \`app-debug.apk\` | Android debug key (test installs only) |"
            fi
            if [ -f "$TMP"/cdn-moonshine-*-release-unsigned.apk ]; then
              echo "| cdn-moonshine-${BUILD_DATE}-${SHORT_SHA}-release-unsigned.apk | \`app-release-unsigned.apk\` | **unsigned — sign it yourself** |"
            fi
            echo
            echo '```'
            cat "$TMP/SHA256SUMS"
            echo '```'
            echo
            echo "Commit: \`$(git rev-parse HEAD)\`"
            echo
            echo "Signing instructions: \`docs/SIGNING.md\`. This workflow holds no keys."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "artifacts_dir=$TMP" >> "$GITHUB_OUTPUT"
          ls -l "$TMP"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          # Signs a statement tying these exact files to this workflow, this commit and
          # this run. Anyone can then check an APK against the repo:
          #
          #   gh attestation verify <file.apk> --repo Canada-eCoin/cdn-moonshine
          #
          # No key of yours is involved: the signature comes from a short-lived OIDC
          # token and the public Sigstore infrastructure. This is what makes "download it
          # and sign it yourself" checkable rather than a matter of trust.
          subject-path: ${{ steps.stamp.outputs.artifacts_dir }}/*.apk

      - name: Attach APKs
        uses: actions/upload-artifact@v7
        with:
          name: cdn-moonshine-${{ env.BUILD_DATE }}-${{ env.SHORT_SHA }}
          path: ${{ steps.stamp.outputs.artifacts_dir }}/*
          if-no-files-found: error
          # Long enough that whoever intends to sign and publish an APK still can.
          retention-days: 90
