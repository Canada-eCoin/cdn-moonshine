# iOS CI — manually driven, on purpose, like the Android workflow.
#
#     gh workflow run "iOS build (manual)" --ref master
#
# WHY THERE IS NO LINT/TEST JOB HERE: lint and jest are platform-agnostic and already
# run in the Android workflow's `verify` job. Running them again on a macOS runner
# would cost 10x the minutes for no additional signal. If you want the gate, dispatch
# the Android workflow; this workflow's job is to prove the *iOS app* builds.
#
# THIS WORKFLOW HOLDS NO KEYS, and unlike Android that is a hard constraint rather than
# a preference: an iOS app cannot be installed on a device without a signature Apple
# ties to a developer account. There is no `apksigner` equivalent. So this produces:
#
#   1. a simulator .app   — unsigned, runnable in Simulator, needs no account
#   2. an unsigned .xcarchive — the real device build, for whoever holds a certificate
#      and provisioning profile to sign and export themselves
#
# See docs/SIGNING-iOS.md.
#
# Cost note: macOS runners bill at 10x for private repos, but this repo is public, so
# these runs are free.

name: iOS build (manual)

on:
  workflow_dispatch:
    inputs:
      artifacts:
        description: Which artifacts to produce
        type: choice
        options:
          - both
          - simulator-only
          - device-unsigned-only
        default: both

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # React Native 0.78 targets the Xcode 16.x line. macos-15's *default* is 16.4 today,
  # but the image also carries 16.0-16.3 and the 26.x line, and `macos-latest` has
  # already moved to macOS 26 — so the version is selected explicitly rather than
  # inherited.
  XCODE_VERSION: '16.4'
  # Release embeds the JS bundle, so the resulting .app runs without a Metro packager.
  # A Debug simulator build would need `react-native start` beside it to be useful.
  XCODE_CONFIGURATION: 'Release'
  SCHEME: 'moonshine'

jobs:
  build:
    name: Build iOS
    # macos-15 (arm64) carries Xcode 16.4. macos-latest is macOS 26 now, newer than this
    # React Native release expects.
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode and report toolchain
        run: |
          set -euo pipefail
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          {
            echo "### Toolchain"
            echo
            echo '```'
            xcodebuild -version
            echo "cocoapods: $(pod --version)"
            echo "ruby: $(ruby --version)"
            echo "node: $(node --version)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # No Podfile.lock is committed (the one in the tree pinned React 0.63.3, five
      # majors behind). This resolves fresh and the generated lock is uploaded as an
      # artifact so it can be committed again.
      - name: Install CocoaPods
        working-directory: ios
        env:
          COCOAPODS_DISABLE_STATS: 'true'
        run: pod install

      - name: Build simulator app
        if: inputs.artifacts != 'device-unsigned-only'
        env:
          DD: ${{ runner.temp }}/dd
        run: |
          set -euo pipefail
          # Diagnostics: if a build fails on C++ headers (the first iOS run failed on
          # '<memory> file not found' while the app target was still on gnu++0x), these
          # four lines say exactly why without needing a 40-minute rebuild.
          {
            echo "### App target build settings"
            echo
            echo '```'
            xcodebuild -workspace ios/moonshine.xcworkspace -scheme "$SCHEME" \
              -configuration "$XCODE_CONFIGURATION" -showBuildSettings 2>/dev/null \
              | grep -E "CLANG_CXX_LANGUAGE_STANDARD|CLANG_CXX_LIBRARY|CLANG_ENABLE_MODULES|SWIFT_ENABLE_EXPLICIT_MODULES|_EXPERIMENTAL_SWIFT_EXPLICIT|IPHONEOS_DEPLOYMENT_TARGET|ENABLE_USER_SCRIPT_SANDBOXING" \
              | sort -u
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          xcodebuild \
            -workspace ios/moonshine.xcworkspace \
            -scheme "$SCHEME" \
            -configuration "$XCODE_CONFIGURATION" \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            build

      - name: Build unsigned device archive
        if: inputs.artifacts != 'simulator-only'
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/moonshine.xcworkspace \
            -scheme "$SCHEME" \
            -configuration "$XCODE_CONFIGURATION" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/moonshine.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" PROVISIONING_PROFILE_SPECIFIER="" DEVELOPMENT_TEAM="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            archive

      - name: Package and checksum
        id: stamp
        run: |
          set -euo pipefail
          BUILD_DATE="$(date -u +'%Y-%m-%d-%H%M')"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          echo "BUILD_DATE=$BUILD_DATE" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"

          OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT"
          BASE="moonshine-${BUILD_DATE}-${SHORT_SHA}"

          APP="$RUNNER_TEMP/dd/Build/Products/${XCODE_CONFIGURATION}-iphonesimulator/moonshine.app"
          if [ -d "$APP" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$APP" "$OUT/${BASE}-simulator.app.zip"
          fi

          if [ -d "$RUNNER_TEMP/moonshine.xcarchive" ]; then
            ditto -c -k --sequesterRsrc --keepParent \
              "$RUNNER_TEMP/moonshine.xcarchive" "$OUT/${BASE}-unsigned.xcarchive.zip"
          fi

          if [ ! -d "$APP" ] && [ ! -d "$RUNNER_TEMP/moonshine.xcarchive" ]; then
            echo "::error::Neither artifact was produced — see the xcodebuild output above."
            exit 1
          fi

          cp ios/Podfile.lock "$OUT/Podfile.lock" 2>/dev/null || true
          ( cd "$OUT" && shasum -a 256 ./* > SHA256SUMS )

          {
            echo "### Build $BUILD_DATE ($SHORT_SHA)"
            echo
            echo "| artifact | signed |"
            echo "|---|---|"
            if [ -f "$OUT/${BASE}-simulator.app.zip" ]; then
              echo "| \`${BASE}-simulator.app.zip\` | n/a — simulator only, install with \`xcrun simctl install\` |"
            fi
            if [ -f "$OUT/${BASE}-unsigned.xcarchive.zip" ]; then
              echo "| \`${BASE}-unsigned.xcarchive.zip\` | **unsigned — sign and export it yourself** |"
            fi
            echo
            echo '```'
            cat "$OUT/SHA256SUMS"
            echo '```'
            echo
            echo "Commit: \`$(git rev-parse HEAD)\`"
            echo
            echo "Signing instructions: \`docs/SIGNING-iOS.md\`. This workflow holds no keys."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          ls -l "$OUT"

      - name: Attach artifacts
        uses: actions/upload-artifact@v7
        with:
          name: moonshine-ios-${{ env.BUILD_DATE }}-${{ env.SHORT_SHA }}
          path: ${{ steps.stamp.outputs.out }}/*
          if-no-files-found: error
          # Long enough that whoever intends to sign and publish still can.
          retention-days: 90
