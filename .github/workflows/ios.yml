# iOS CI — manually driven, on purpose, like the Android workflow.
#
#     gh workflow run "iOS build (manual)" --ref master
#
# WHY THERE IS NO LINT/TEST JOB HERE: lint and jest are platform-agnostic and already
# run in the Android workflow's `verify` job. Running them again on a macOS runner
# would cost 10x the minutes for no additional signal. If you want the gate, dispatch
# the Android workflow; this workflow's job is to prove the *iOS app* builds.
#
# THIS WORKFLOW HOLDS NO KEYS, and unlike Android that is a hard constraint rather than
# a preference: an iOS app cannot be installed on a device without a signature Apple
# ties to a developer account. There is no `apksigner` equivalent. So this produces:
#
#   1. a simulator .app   — unsigned, runnable in Simulator, needs no account
#   2. an unsigned .xcarchive — the real device build, for whoever holds a certificate
#      and provisioning profile to sign and export themselves
#
# See docs/SIGNING-iOS.md.
#
# Cost note: macOS runners bill at 10x for private repos, but this repo is public, so
# these runs are free.
#
# Toolchain: the `xcode_version` input defaults to 16.4 (the Xcode 16.x line React Native
# 0.78 targets). 26.3 exists as a second option because Xcode's compilation cache — a
# content-addressed cache that, unlike the DerivedData cache, is still valid for unchanged
# sources — only exists in Xcode 26 and later. That path is currently BLOCKED: Xcode 26
# does not ship the Swift 5.6 compatibility shim, so the Swift pods in this project
# cannot link under it. See the note in the simulator build step for the evidence and the
# two workarounds that were tried and failed.

name: iOS build (manual)

on:
  workflow_dispatch:
    inputs:
      artifacts:
        description: Which artifacts to produce
        type: choice
        options:
          - both
          - simulator-only
          - device-unsigned-only
        default: both
      xcode_version:
        description: Xcode toolchain (26.x is required for the compilation cache)
        type: choice
        options:
          - '16.4'
          - '26.3'
        default: '16.4'

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # Release embeds the JS bundle, so the resulting .app runs without a Metro packager.
  # A Debug simulator build would need `react-native start` beside it to be useful.
  XCODE_CONFIGURATION: 'Release'
  SCHEME: 'moonshine'
  # Xcode's compilation cache (LLVM CAS) is a CONTENT-ADDRESSED cache: it keys on input
  # hashes, not timestamps, which is what the DerivedData cache cannot do — a fresh
  # checkout makes every source file newer than the cached objects, so Xcode rebuilds all
  # ~2800 of them regardless. Two caveats: the feature landed in Xcode 26, and React
  # Native 0.78 targets the Xcode 16.x line. So the toolchain is an explicit input,
  # defaulting to the known-good 16.4; 26.3 is the opt-in experiment, and it needs to be
  # shown that these pods compile under it at all before it becomes the default.
  COMPILATION_CACHE_DIR: 'compilation-cache'

jobs:
  build:
    name: Build iOS
    # macos-15 (arm64) carries Xcode 16.4. macos-latest is macOS 26 now, newer than this
    # React Native release expects.
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
      # For actions/attest-build-provenance. A short-lived OIDC token plus write access to
      # this run's attestations — not a stored secret, not a signing key, and nothing that
      # can read a secret or push a commit.
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode and report toolchain
        run: |
          set -euo pipefail
          sudo xcode-select -s "/Applications/Xcode_${{ inputs.xcode_version }}.app"
          {
            echo "### Toolchain"
            echo
            echo '```'
            xcodebuild -version
            echo "cocoapods: $(pod --version)"
            echo "ruby: $(ruby --version)"
            echo "node: $(node --version)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Caches are scoped so that a run can only restore caches written on its own
      # branch or on the default branch, and an entry is immutable once written for a
      # given key. So nothing a feature branch writes can ever be consumed by master —
      # poisoning a cache master reads requires the ability to write to master, which
      # already means pushing code. Nothing sensitive may be cached (caches are readable
      # by anyone with repo read access); these two hold dependencies and compile
      # output, no key material.
      #
      # Keys are deliberately STABLE (no run id) rather than refreshed per run: a
      # DerivedData cache is measured in gigabytes, and a per-run key would add another
      # multi-GB entry every run until LRU eviction started evicting the Gradle caches.
      # One entry per Podfile.lock is the right granularity — pods are what take the
      # time, and they only change when the lock does. Xcode recompiles whatever moved.
      - name: Restore CocoaPods download cache
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/CocoaPods
          key: cocoapods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            cocoapods-${{ runner.os }}-

      - name: Restore DerivedData cache
        uses: actions/cache@v6
        with:
          # Intermediates only: that is where the ~45 minutes of compiling 230 pods
          # ends up. Build/Products (linked .app bundles and dSYMs) is regenerated
          # cheaply and is what would blow the repo's 10 GB cache budget.
          path: ~/dd/Build/Intermediates.noindex
          key: ios-intermediates-${{ runner.os }}-xcode${{ inputs.xcode_version }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ios-intermediates-${{ runner.os }}-xcode${{ inputs.xcode_version }}-

      # Xcode's compilation cache. Content-addressed, so — unlike the DerivedData cache
      # above — a restored entry is still *correct* for unchanged sources. On Xcode 16.4
      # the settings are simply unrecognised and nothing is written; the size report in
      # the packaging step makes that visible rather than silently pretending to cache.
      - name: Restore compilation cache
        uses: actions/cache@v6
        with:
          # Xcode's own CAS default lives under DerivedData, but the diagnostics proved
          # the explicit COMPILATION_CACHE_CAS_PATH is honoured (it resolved to
          # /Users/runner/compilation-cache), so one path is enough.
          path: ~/compilation-cache
          key: xcode-compilation-cache-${{ runner.os }}-xcode${{ inputs.xcode_version }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            xcode-compilation-cache-${{ runner.os }}-xcode${{ inputs.xcode_version }}-

      # ios/Podfile.lock is committed, so this install is pinned. It is NOT run with
      # --deployment yet, which means CocoaPods will quietly update the lock if a podspec
      # moves underneath it. Making that a hard gate — the equivalent of
      # `yarn install --frozen-lockfile` — needs its own validation run; noted in the
      # brief rather than assumed here.
      - name: Install CocoaPods
        working-directory: ios
        env:
          COCOAPODS_DISABLE_STATS: 'true'
        run: pod install

      - name: Build simulator app
        if: inputs.artifacts != 'device-unsigned-only'
        run: |
          set -euo pipefail
          # $HOME must be expanded by the SHELL. An `env: DD: $HOME/dd` block does not
          # expand it — GitHub passes the literal string through — which produced
          # `<cwd>/$HOME/dd` and a ModuleCache path mismatch. A stable path is required
          # because this directory is what the DerivedData cache stores.
          DD="$HOME/dd"
          CAS="$HOME/$COMPILATION_CACHE_DIR"
          mkdir -p "$CAS"
          # Xcode 26 does not ship the Swift 5.6 compatibility shims, and the Swift pods in
          # this project (VisionCamera, lottie-ios, lottie-react-native) fail to link
          # against it — for BOTH architectures, not just the Intel slice as the first
          # failure suggested:
          #   Undefined symbols for architecture arm64:
          #     "__swift_FORCE_LOAD_$_swiftCompatibility56", referenced from liblottie-ios.a
          #
          # That force-load is emitted when the deployment target predates the OS release
          # that shipped the Swift 5.6 runtime, which is iOS 15.4. This project targets
          # 15.1, so the shim is pulled in and cannot be found. On 26.x the deployment
          # target is therefore raised to 15.4 as a build setting. Scoped to 26.x on
          # purpose: raising it for everyone would drop iOS 15.1-15.3 support, which is
          # the operator's call rather than a side effect of a toolchain experiment.
          # --- Xcode 26 is currently BLOCKED for this dependency set ---------------
          #
          # The compilation cache exists and works, but Xcode 26 cannot link the Swift
          # pods in this project (VisionCamera, lottie-ios, lottie-react-native), for
          # BOTH architectures:
          #
          #   Undefined symbols for architecture arm64:
          #     "__swift_FORCE_LOAD_$_swiftCompatibility56", referenced from liblottie-ios.a
          #   Undefined symbols for architecture x86_64:   (same symbol, same pods)
          #
          # Xcode 26 does not ship the Swift 5.6 compatibility shim. Pods compiled in
          # Swift 5 language mode (lottie-react-native's podspec declares swift_version
          # 5.9) emit a force-load reference to it, so they cannot link at all.
          #
          # Two attempts to work around it, both of which failed, recorded so nobody
          # repeats them:
          #
          #   * ARCHS=arm64 — the x86_64 slice was never the whole story; it was merely
          #     the slice that linked first. arm64 fails identically.
          #   * IPHONEOS_DEPLOYMENT_TARGET=15.4 — this does NOT remove the reference.
          #     An earlier run was misread as proof it did: LinkAssetCatalog and
          #     ProcessInfoPlistFile run in parallel with linking, so seeing Moonshine.app
          #     being assembled said nothing about whether the link succeeded.
          #
          # The settings are kept because they are harmless on the default 16.4 build and
          # inert on 26.x; the real fix is upgrading or dropping those three pods, which
          # is its own piece of work. When that happens, this path is one dispatch away,
          # and the build's own instrumentation reports the result:
          #
          #   CompilationCacheMetrics
          #   note: 0 hits / 1624 cacheable tasks (0%)     <- cold; a warm run is the test
          #
          # --- end blocked path ------------------------------------------------------
          ARCH_SETTING=""
          DEPLOY_SETTING=""
          case "${{ inputs.xcode_version }}" in
            26.*)
              ARCH_SETTING="ARCHS=arm64"
              DEPLOY_SETTING="IPHONEOS_DEPLOYMENT_TARGET=15.4"
              ;;
          esac
          # Diagnostics: if a build fails on C++ headers (the first iOS run failed on
          # '<memory> file not found'), these lines say why without needing a 40-minute
          # rebuild. Teed to stdout as well as the summary so they are readable from
          # the job log via `gh run view --log`.
          {
            echo "### App target build settings"
            echo
            echo '```'
            xcodebuild -workspace ios/moonshine.xcworkspace -scheme "$SCHEME" \
              -configuration "$XCODE_CONFIGURATION" -derivedDataPath "$DD" \
              COMPILATION_CACHE_ENABLE_CACHING=YES \
              COMPILATION_CACHE_CAS_PATH="$CAS" \
              -showBuildSettings 2>/dev/null \
              | grep -E "CLANG_CXX_LANGUAGE_STANDARD|CLANG_CXX_LIBRARY|CLANG_ENABLE_MODULES|SWIFT_ENABLE_EXPLICIT_MODULES|_EXPERIMENTAL_SWIFT_EXPLICIT|IPHONEOS_DEPLOYMENT_TARGET|ENABLE_USER_SCRIPT_SANDBOXING|COMPILATION_CACHE" \
              | sort -u
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

          xcodebuild \
            -workspace ios/moonshine.xcworkspace \
            -scheme "$SCHEME" \
            -configuration "$XCODE_CONFIGURATION" \
            -sdk iphonesimulator \
            -derivedDataPath "$DD" \
            -resultBundlePath "$RUNNER_TEMP/simulator.xcresult" \
            $ARCH_SETTING \
            $DEPLOY_SETTING \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            COMPILATION_CACHE_CAS_PATH="$CAS" \
            COMPILATION_CACHE_ENABLE_DIAGNOSTIC_REMARKS=YES \
            build

      - name: Build unsigned device archive
        if: inputs.artifacts != 'simulator-only'
        run: |
          set -euo pipefail
          # Same DerivedData as the simulator build, so the two share the cached
          # intermediates and the device compile is incremental. Same compilation cache
          # too: content-addressed, so the simulator's artifacts can serve the device
          # build for anything architecture-independent.
          DD="$HOME/dd"
          CAS="$HOME/$COMPILATION_CACHE_DIR"
          mkdir -p "$CAS"
          # Defined here as well as in the simulator step, and it must be: with `set -u`
          # an unset variable is fatal, and referencing the simulator step's copy made
          # this step die instantly — which broke the default 16.4 device archive, the
          # artifact that actually gets published. The device build needs the raised
          # deployment target for the same Swift-shim reason on 26.x.
          DEPLOY_SETTING=""
          case "${{ inputs.xcode_version }}" in
            26.*) DEPLOY_SETTING="IPHONEOS_DEPLOYMENT_TARGET=15.4" ;;
          esac
          xcodebuild \
            -workspace ios/moonshine.xcworkspace \
            -scheme "$SCHEME" \
            -configuration "$XCODE_CONFIGURATION" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/moonshine.xcarchive" \
            -resultBundlePath "$RUNNER_TEMP/archive.xcresult" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" PROVISIONING_PROFILE_SPECIFIER="" DEVELOPMENT_TEAM="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            COMPILATION_CACHE_CAS_PATH="$CAS" \
            COMPILATION_CACHE_ENABLE_DIAGNOSTIC_REMARKS=YES \
            $DEPLOY_SETTING \
            archive

      # The .app is built and then, everywhere else in this repo, never executed. A wallet
      # whose bundle throws during launch — a ReferenceError from an unimported global,
      # say, which is exactly the bug class Jest caught on 2026-10-09 — would otherwise
      # ship unnoticed. The image carries iOS 18.x runtimes, so this is cheap.
      - name: Boot the simulator app
        if: inputs.artifacts != 'device-unsigned-only'
        run: |
          set -euo pipefail
          APP="$(find "$HOME/dd/Build/Products/${XCODE_CONFIGURATION}-iphonesimulator" \
                   -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo "::error::no simulator .app was produced to boot."
            exit 1
          fi
          BUNDLE_ID="$(plutil -extract CFBundleIdentifier raw "$APP/Info.plist")"

          UDID="$(xcrun simctl list devices available \
                    | grep -E '^[[:space:]]+iPhone' | head -1 \
                    | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')"
          if [ -z "$UDID" ]; then
            echo "::error::no available iPhone simulator runtime on this image."
            exit 1
          fi

          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"

          LOG="$RUNNER_TEMP/simulator-console.log"
          ( xcrun simctl launch --console-pty "$UDID" "$BUNDLE_ID" > "$LOG" 2>&1 ) &
          LAUNCHER=$!
          sleep 30

          PROBLEMS=0
          # A JS exception or a native crash shows up in the app's own console stream.
          if grep -qiE 'Unhandled JS Exception|RCTFatal|ReferenceError|is not defined|Fatal error|NSInternalInconsistency' "$LOG"; then
            echo "::error::the app logged a fatal error during launch:"
            grep -iE 'Unhandled JS Exception|RCTFatal|ReferenceError|is not defined|Fatal error|NSInternalInconsistency' "$LOG" | head -20
            PROBLEMS=1
          fi
          # And independently of the console: is it still running?
          if ! xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -q "$BUNDLE_ID"; then
            echo "::error::the app is not running 30 seconds after launch — it did not survive startup."
            PROBLEMS=1
          fi
          kill "$LAUNCHER" 2>/dev/null || true

          if [ "$PROBLEMS" -ne 0 ]; then
            echo '--- console log (whole file) ---'
            cat "$LOG" || true
            # The console stream is often empty when the app dies before JS starts, and the
            # runner usually has no .ips report. The simulator's unified log is where the
            # reason actually is: dyld failures, missing frameworks, NSException, codesign.
            echo '--- simulator unified log, last 3 minutes, app process ---'
            PROCESS="$(basename "$APP" .app)"
            xcrun simctl spawn "$UDID" log show --last 3m --style compact \
              --predicate "process == \"$PROCESS\"" 2>/dev/null | tail -50 || true
            echo '--- is the app installed where we think it is? ---'
            xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" 2>&1 || true
            echo '--- services matching the bundle id ---'
            xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -i "$BUNDLE_ID" || echo '(not listed)'
            echo '--- recent simulator crash reports ---'
            ls -t "$HOME/Library/Logs/DiagnosticReports"/*.ips 2>/dev/null | head -3 || echo '(none)'
            exit 1
          fi

          {
            echo "### Simulator smoke test"
            echo
            echo "\`$BUNDLE_ID\` launched on runtime \`$UDID\` and was still running after 30s."
            echo
            echo '```'
            tail -15 "$LOG" || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Package and checksum
        id: stamp
        run: |
          set -euo pipefail
          BUILD_DATE="$(date -u +'%Y-%m-%d-%H%M')"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          echo "BUILD_DATE=$BUILD_DATE" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"

          OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT"
          BASE="moonshine-${BUILD_DATE}-${SHORT_SHA}"
          DD="$HOME/dd"

          # Matched by glob, not by name: the product is built as `Moonshine.app` even
          # though the target is `moonshine`, and this step runs on a case-insensitive
          # volume, so a name mismatch used to pass by luck.
          APP="$(find "$DD/Build/Products/${XCODE_CONFIGURATION}-iphonesimulator" \
                   -maxdepth 1 -name '*.app' -print -quit 2>/dev/null || true)"
          if [ -n "$APP" ] && [ -d "$APP" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$APP" "$OUT/${BASE}-simulator.app.zip"
          fi

          if [ -d "$RUNNER_TEMP/moonshine.xcarchive" ]; then
            ditto -c -k --sequesterRsrc --keepParent \
              "$RUNNER_TEMP/moonshine.xcarchive" "$OUT/${BASE}-unsigned.xcarchive.zip"
          fi

          if ! ls "$OUT"/*.zip >/dev/null 2>&1; then
            echo "::error::Neither artifact was produced — see the xcodebuild output above."
            exit 1
          fi

          # --- artifact invariants -------------------------------------------------
          # Checked against the artifacts rather than assumed, because docs/SIGNING-iOS.md
          # makes promises about them:
          #   * the archive must be UNSIGNED — an archive carrying a signing identity would
          #     mean an APK-style accident, where the artifact looks publishable but is tied
          #     to somebody else's certificate;
          #   * MinimumOSVersion must satisfy React Native 0.78's floor of iOS 15.1, or the
          #     simulator build would install on a target the framework does not support.
          # Bundle id and version are REPORTED, not asserted, so a deliberate version bump
          # cannot fail the build — but drift is visible here rather than only in a doc that
          # still says `com.kisswallet` and `0.4.0`.
          CHECK="$RUNNER_TEMP/invariants.txt"
          : > "$CHECK"

          if [ -n "$APP" ] && [ -d "$APP" ]; then
            BID="$(plutil -extract CFBundleIdentifier raw "$APP/Info.plist" 2>/dev/null || echo '')"
            MKT="$(plutil -extract CFBundleShortVersionString raw "$APP/Info.plist" 2>/dev/null || echo '')"
            BLD="$(plutil -extract CFBundleVersion raw "$APP/Info.plist" 2>/dev/null || echo '')"
            MINOS="$(plutil -extract MinimumOSVersion raw "$APP/Info.plist" 2>/dev/null || echo '')"
            echo "simulator .app: bundle id=$BID  version=$MKT ($BLD)  MinimumOSVersion=$MINOS" >> "$CHECK"

            if [ -z "$MINOS" ]; then
              echo "::error::could not read MinimumOSVersion from $APP/Info.plist"
              exit 1
            fi
            if ! python3 -c "import sys; a=[int(x) for x in sys.argv[1].split('.')[:2]]; sys.exit(0 if tuple(a) >= (15, 1) else 1)" "$MINOS"; then
              echo "::error::MinimumOSVersion is $MINOS, below the iOS 15.1 floor React Native 0.78 requires."
              exit 1
            fi
          fi

          ARCHINFO="$RUNNER_TEMP/moonshine.xcarchive/Info.plist"
          if [ -f "$ARCHINFO" ]; then
            # plutil writes its error to STDOUT, not stderr, so an absent key looks like a
            # non-empty value. Branch on the exit status, not on emptiness — an archive with
            # no SigningIdentity key at all is the unsigned case, which is what we want.
            if SIGNID="$(plutil -extract SigningIdentity raw "$ARCHINFO" 2>/dev/null)" && [ -n "$SIGNID" ]; then
              echo "::error::the archive carries a signing identity ($SIGNID). It must be unsigned so whoever publishes can sign it with their own certificate."
              exit 1
            fi
            echo "archive: unsigned (no SigningIdentity, as intended)" >> "$CHECK"
            if [ -f "$RUNNER_TEMP/moonshine.xcarchive/Products/Applications/Moonshine.app/Info.plist" ]; then
              APPP="$RUNNER_TEMP/moonshine.xcarchive/Products/Applications/Moonshine.app/Info.plist"
              echo "archive app: bundle id=$(plutil -extract CFBundleIdentifier raw "$APPP" 2>/dev/null)  MinimumOSVersion=$(plutil -extract MinimumOSVersion raw "$APPP" 2>/dev/null)" >> "$CHECK"
            fi
          fi

          { echo; echo "### Artifact checks"; echo; echo '```'; cat "$CHECK"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

          # Report what the caches actually weigh, so the repo's 10 GB budget is
          # observable rather than assumed.
          {
            echo "### Cache sizes on the runner"
            echo
            echo '```'
            du -sh "$HOME/dd/Build/Intermediates.noindex" 2>/dev/null || echo "no DerivedData"
            du -sh "$HOME/Library/Caches/CocoaPods" 2>/dev/null || echo "no CocoaPods cache"
            for d in "$HOME/$COMPILATION_CACHE_DIR" "$HOME/dd/CompilationCache.noindex"; do
              [ -e "$d" ] && du -sh "$d" || echo "absent: $d"
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

          cp ios/Podfile.lock "$OUT/Podfile.lock" 2>/dev/null || true
          ( cd "$OUT" && shasum -a 256 ./* > SHA256SUMS )

          {
            echo "### Build $BUILD_DATE ($SHORT_SHA)"
            echo
            echo "| artifact | signed |"
            echo "|---|---|"
            if [ -f "$OUT/${BASE}-simulator.app.zip" ]; then
              echo "| \`${BASE}-simulator.app.zip\` | n/a — simulator only, install with \`xcrun simctl install\` |"
            fi
            if [ -f "$OUT/${BASE}-unsigned.xcarchive.zip" ]; then
              echo "| \`${BASE}-unsigned.xcarchive.zip\` | **unsigned — sign and export it yourself** |"
            fi
            echo
            echo '```'
            cat "$OUT/SHA256SUMS"
            echo '```'
            echo
            echo "Commit: \`$(git rev-parse HEAD)\`"
            echo
            echo "Signing instructions: \`docs/SIGNING-iOS.md\`. This workflow holds no keys."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          ls -l "$OUT"

      # A 20-minute iOS build that dies leaves nothing behind otherwise: the .xcresult
      # holds the full build log, the failing command and the diagnostics, which is the
      # difference between reading an answer and guessing at one.
      - name: Upload build diagnostics (only on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-diagnostics-${{ env.BUILD_DATE }}-${{ env.SHORT_SHA }}
          path: |
            ${{ runner.temp }}/*.xcresult
            ${{ runner.temp }}/simulator-console.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          # Ties these exact files to this workflow, this commit and this run. Anyone can
          # then check an artifact against the repo:
          #
          #   gh attestation verify <file> --repo Canada-eCoin/cdn-moonshine
          #
          # Signed by a short-lived OIDC token and public Sigstore infrastructure — none
          # of your keys. It is what makes "download it and sign it yourself" checkable.
          subject-path: ${{ steps.stamp.outputs.out }}/*.zip

      - name: Attach artifacts
        uses: actions/upload-artifact@v7
        with:
          name: moonshine-ios-${{ env.BUILD_DATE }}-${{ env.SHORT_SHA }}
          path: ${{ steps.stamp.outputs.out }}/*
          if-no-files-found: error
          # Long enough that whoever intends to sign and publish still can.
          retention-days: 90
